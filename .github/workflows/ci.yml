name: Full CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      FRONTEND_URL: http://localhost:3000

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install wait-on
        run: npm install -g wait-on

      # Backend
      - name: Start Backend
        run: |
          cd @1234/backend
          mvn clean install -DskipTests
          mvn spring-boot:run &

      - name: Wait for Backend
        run: |
          if wait-on --timeout 120000 http://localhost:8080/actuator/health; then
            echo "Spring Boot actuator health endpoint is ready."
          else
            echo "Actuator health endpoint not available, falling back to tcp:8080."
            wait-on tcp:8080
          fi

      # Frontend
      - name: Start Frontend
        run: |
          cd @1234/frontend
          npm install
          npm run build
          npm start &

      - name: Wait for Frontend
        run: wait-on $FRONTEND_URL

      - name: Extra wait
        run: sleep 5

      - name: Run Selenium Tests
        run: |
          cd automation
          mvn test -DbaseUrl=$FRONTEND_URL -Dheadless=true
